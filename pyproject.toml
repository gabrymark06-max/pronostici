[project]
name = "pronostici"
version = "0.1.0"
description = "Motore di calcolo dei pronostici calcistici: job CLI, nessun server."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Solo il job `sofascore` ne ha bisogno: Sofascore risponde 403 a chi non
# presenta l'impronta TLS di un browser, e `curl_cffi` è l'unica libreria che
# la porta. Sta in un extra e non fra le dipendenze normali perché gli altri
# job — ingest, score, quote — non chiamano Sofascore e non devono compilarsi
# una libreria in più su ogni runner.
sofascore = ["curl_cffi>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
src = ["src"]
line-length = 90
target-version = "py311"
# `design-system/` non e' codice dell'applicazione: contiene uno script di
# servizio che ristampa i rapporti di contrasto della palette. Vive accanto
# alla specifica che documenta, non dentro il pacchetto, e non e' importato da
# niente.
exclude = ["design-system"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
