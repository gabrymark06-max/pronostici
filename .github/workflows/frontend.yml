name: frontend

# IL SITO SI COSTRUISCE DAVVERO, A OGNI PUSH.
#
# Fino al 12 agosto 2026 la sola integrazione erano i test Python. Il frontend
# non veniva mai costruito da nessuna macchina che non fosse quella di chi
# scriveva: un errore di tipo, un token divergente o una parola vietata finiti
# in `main` sarebbero rimasti li' fino al build successivo a mano.
#
# I quattro controlli non sono generici: ognuno presidia un guasto che questo
# progetto ha gia' avuto.
#
#   check:tokens   `styles/tokens.css` e' generato da `design-system/`. Le due
#                  copie hanno divergito una volta e il confronto ignorava i
#                  fine riga, quindi passava su Linux e falliva su Windows.
#   typecheck      il contratto con `data/` e' tipizzato: uno schema che cambia
#                  senza che i tipi lo seguano deve fermare la build.
#   lint           regole React che hanno gia' pescato un `setState` dentro un
#                  effetto.
#   build          include `check-parole-vietate`, che gira DOPO ed e' l'unico
#                  controllo che legge il testo davvero pubblicato: ha fermato
#                  «rendimento» nella barra e «peso della stima» su 21 schede.
#
# I quattro controlli non toccano la rete e non hanno bisogno di segreti: i dati
# sono nel repo. Il job `pubblica`, che viene dopo, e' l'unico che esce di qui —
# e senza i segreti dell'hosting si limita a dire cosa manca, senza fallire.

# I COMMIT DEL BOT NON INNESCANO NIENTE, E QUESTO E' IL PUNTO.
#
# GitHub non fa partire nessun workflow per un push autenticato col
# `GITHUB_TOKEN` predefinito: e' la regola che impedisce ai job di innescarsi
# all'infinito fra loro. Conseguenza, misurata: `tests.yml` parte a ogni push su
# `main` ed e' girato **solo** sui commit fatti a mano, mai su uno di
# `pronostici-bot` — che ne fa parecchi al giorno dentro `data/`.
#
# Senza `workflow_run` il sito pubblicato si fermerebbe al giorno dell'ultimo
# push umano: i dati continuerebbero ad aggiornarsi nel repository e la pagina
# mostrerebbe pronostici vecchi, con l'aria di essere viva. E' il modo peggiore
# di rompersi.
#
# `workflow_run` scatta alla FINE di un altro workflow, non su un push, quindi
# quella regola non lo tocca.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "design-system/**"
      - "data/**"
      - ".github/workflows/frontend.yml"
  workflow_run:
    workflows:
      - "pipeline giornaliera"
      - "quote e pronostico definitivo"
      - "job · sofascore"
    types: [completed]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Token allineati al design system
        run: npm run check:tokens
      - name: Tipi
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # `build` esegue anche `check-parole-vietate` come postbuild.
      - name: Build ed export statico
        run: npm run build

  pubblica:
    needs: build
    # Mai da una pull request: un fork non deve poter pubblicare niente. Dopo
    # una pipeline dati si pubblica solo se e' andata a buon fine — se e'
    # fallita non ha scritto niente, e non c'e' niente di nuovo da mostrare.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # SENZA IL SEGRETO NON SI FALLISCE, SI SPIEGA.
      #
      # Finche' nessuno ha collegato un hosting questo passo dice cosa manca ed
      # esce verde: un job rosso ogni giorno per una cosa che non e' un guasto
      # insegna solo a ignorare i job rossi. Diventa un deploy vero nel momento
      # in cui i tre segreti esistono.
      - name: C'e' un hosting collegato?
        id: hosting
        shell: bash
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROGETTO: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$PROGETTO" ]; then
            echo "collegato=si" >> "$GITHUB_OUTPUT"
          else
            echo "collegato=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Il sito non e' pubblicato"
              echo
              echo "Mancano i segreti per il deploy. Servono tutti e tre:"
              echo '- `VERCEL_TOKEN` — da vercel.com/account/tokens'
              echo '- `VERCEL_ORG_ID` e `VERCEL_PROJECT_ID` — in `.vercel/project.json`'
              echo '  dopo un `vercel link` fatto una volta in locale'
              echo
              echo "Il brief (§11.2) sceglie **Vercel Hobby**, con Cloudflare Pages"
              echo "come uscita pronta se un giorno servisse."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.hosting.outputs.collegato == 'si'
        run: npm ci
      - if: steps.hosting.outputs.collegato == 'si'
        name: Build ed export statico
        run: npm run build

      # SI PUBBLICA L'EXPORT, NON IL PROGETTO.
      #
      # `out/` e' gia' tutto il sito: HTML statico, nessun runtime, nessuna
      # chiave. Darlo a Vercel come cartella statica evita che ricostruisca da
      # solo con impostazioni sue, che e' il modo classico di ritrovarsi in
      # produzione un build diverso da quello appena controllato qui sopra.
      - if: steps.hosting.outputs.collegato == 'si'
        name: Pubblica su Vercel
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          INDIRIZZO=$(npx --yes vercel@latest deploy out \
            --prod --yes --archive=tgz \
            --token="${{ secrets.VERCEL_TOKEN }}")
          echo "### Pubblicato" >> "$GITHUB_STEP_SUMMARY"
          echo "$INDIRIZZO" >> "$GITHUB_STEP_SUMMARY"
          echo "Pubblicato su $INDIRIZZO"

  pagine:
    needs: build
    # Solo quando NON c'e' un hosting collegato: se un giorno arrivano i
    # segreti di Vercel — che e' la scelta del brief, §11.2 — pubblica quello e
    # questo si fa da parte. Nel frattempo il registro pubblico e' pubblico
    # davvero, senza dipendere da nessun account di terzi.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: C'e' gia' un hosting collegato?
        id: hosting
        shell: bash
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "salta=si" >> "$GITHUB_OUTPUT"
            echo "Vercel e' configurato: Pages si fa da parte." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "salta=no" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.hosting.outputs.salta == 'no'
        run: npm ci

      # IL PREFISSO NON E' FACOLTATIVO QUI.
      #
      # Pages serve da `utente.github.io/nome-repo/`, quindi ogni percorso
      # radicato va spostato sotto quel prefisso: senza, si ottiene una pagina
      # che si carica e poi non porta da nessuna parte, con i loghi rotti.
      # `NEXT_PUBLIC_SITO` evita che il sitemap dichiari il dominio segnaposto.
      - if: steps.hosting.outputs.salta == 'no'
        name: Build ed export statico
        env:
          NEXT_PUBLIC_PREFISSO: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITO: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - if: steps.hosting.outputs.salta == 'no'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - if: steps.hosting.outputs.salta == 'no'
        id: deploy
        uses: actions/deploy-pages@v4
