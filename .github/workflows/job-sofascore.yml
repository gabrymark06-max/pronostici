name: job · sofascore

# FORMAZIONI, ARBITRO E QUOTE ESTESE.
#
# PERCHE' ESISTE QUESTO FILE, e non e' una nota di colore. Fino al 14 agosto
# 2026 questo job era l'unico della pipeline che NON girava qui: dipendeva da
# un binario Go che stava solo su un portatile, e girava su un'attivita'
# pianificata di Windows. A computer spento, formazioni e arbitro di quei
# giorni erano persi per sempre — sono dati che esistono solo PRIMA del fischio
# d'inizio e non si recuperano dopo, a differenza di un risultato.
#
# Adesso il trasporto e' `curl_cffi` (vedi `sources/sofascore_http.py`) e
# questo job e' come tutti gli altri.
#
# DUE ESECUZIONI AL GIORNO, e le due ore sono scelte:
#
#   · 07:00 UTC — dopo la pipeline delle 03:00, quindi le partite di oggi ci
#     sono gia'. Prende le probabili formazioni, che Sofascore pubblica con
#     giorni d'anticipo (mediana misurata: 56 ore prima del fischio);
#   · 17:00 UTC — a ridosso delle partite serali europee, per l'arbitro. Le
#     designazioni escono tardi, e alle 07:00 quasi sempre non ci sono ancora:
#     misurato, l'arbitro passa da 14 partite a 26 fra un giro e l'altro.
#
# NON SCRIVE MAI SU UNA PARTITA GIA' COMINCIATA: il job si ferma da solo al
# fischio d'inizio, perche' dopo quelle non sono piu' informazioni pre-partita.
#
# SE SOFASCORE NON RISPONDE il job non fallisce la pipeline: le partite restano
# senza contorno, che e' esattamente com'erano prima. Il pronostico non dipende
# da qui — si calcola sul modello e sulle quote, e una formazione che manca non
# lo cambia.

# 23 AGOSTO 2026: L'API HA MESSO UN LUCCHETTO, E LA CHIAVE E' UN BROWSER.
#
# Da quel giorno l'API risponde `{"error": {"code": 403, "reason": "challenge"}}`
# a `curl_cffi`. Il sito manda due header che noi non mandavamo: `X-Captcha`,
# un JWT firmato da loro legato all'IP e valido circa un'ora, e
# `X-Requested-With`. Il token non si puo' nemmeno riusare fuori: preso dal
# browser e passato a `curl_cffi` resta 403, perche' e' legato anche alla
# connessione che lo ha ottenuto.
#
# `sources/sofascore_cdp.py` fa le stesse chiamate da dentro un Chrome vero, e
# il giro torna a funzionare: 23 partite agganciate, 21 con formazioni, in 46
# secondi. `sources/sofascore_http.py` prova sempre prima la strada economica e
# passa al browser solo quando il muro e' confermato — se Sofascore riapre la
# porta si torna a `curl_cffi` da soli, senza toccare niente.
#
# SUI RUNNER DI GITHUB NON FUNZIONA, ED E' STATO PROVATO. Chrome parte davvero
# sotto `xvfb-run` e il ripiego scatta come deve, ma la pagina non riceve
# nessun `X-Captcha` entro 45 secondi: il token e' legato all'IP e Sofascore
# non ne emette per gli indirizzi da datacenter. Non e' una configurazione da
# sistemare, e' il loro criterio.
#
# PER QUESTO IL JOB GIRA SU UN RUNNER DI CASA (etichetta `casa`). Il cron parte
# da GitHub come tutti gli altri, ma l'esecuzione avviene su una macchina con
# IP residenziale, e il commit finisce nel registro pubblico come sempre. E'
# l'unico job cosi': gli altri restano su `ubuntu-latest` perche' funzionano, e
# non devono dipendere da un computer acceso.
#
# DUE TRAPPOLE DEL RUNNER DI CASA, viste il 24 agosto 2026.
#
# `bash` NON E' SUL PATH. I passi qui sotto dichiarano `shell: bash` — devono,
# altrimenti il codice di uscita del python finisce dentro `tee` e il job
# resta verde qualunque cosa succeda. Ma `bash.exe` sta nella cartella `bin`
# di Git, e l'installatore mette nel PATH solo `cmd`, che contiene git e
# basta. Lanciando il runner a mano da una shell Git Bash il PATH arriva da
# li' e non si vede niente; lanciato dall'attivita' pianificata eredita il
# PATH nudo dell'utente e ogni passo muore con «bash: command not found». Il
# runner va avviato da `avvia-runner.cmd`, che aggiunge quella cartella.
#
# UN SOLO RUNNER ALLA VOLTA. Due processi con la stessa registrazione si
# contendono la sessione: si legge «A session for this runner already exists»
# e i job restano in coda senza che nessuno li prenda.

# IL CRON RESTA ACCESO APPOSTA: formazioni e arbitro esistono solo prima del
# fischio d'inizio e non si recuperano dopo, quindi il fatto che li stiamo
# perdendo deve restare visibile.

# 24 AGOSTO 2026: QUESTO JOB NON HA PIU' UN ORARIO.
#
# Il cron e' passato a `job-contorno.yml`, che gira su `ubuntu-latest` e non
# ha bisogno di nessun computer acceso. Qui resta la strada a mano, per quando
# si vuole il contorno che solo Sofascore da': la panchina, le medie cartellini
# dell'arbitro e i mercati estesi. Richiede il runner di casa e Chrome.
#
# Il cron NON e' stato lasciato acceso apposta. Con la macchina spenta i job in
# coda scadevano dopo 24 ore lasciando esecuzioni rosse che non erano guasti, e
# un rosso che non e' un guasto insegna solo a non guardare piu' i rossi.

on:
  workflow_call:
    inputs:
      window_days:
        type: string
        required: false
        default: "4"
  workflow_dispatch:
    inputs:
      window_days:
        description: Quanti giorni avanti guardare
        type: string
        required: false
        default: "4"
      dry_run:
        description: Calcola e riporta senza scrivere i fixture
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# LO STESSO GRUPPO DEGLI ALTRI JOB DI DATI, e non e' un dettaglio: tutti
# scrivono in `data/fixtures` e committano. Due che girano insieme finiscono
# per sovrascriversi o per collidere sul push.
concurrency:
  group: pronostici-data
  cancel-in-progress: false

jobs:
  sofascore:
    # A CASA, E SOLO QUESTO JOB.
    #
    # Il token di Sofascore e' legato all'IP e loro non ne emettono per gli
    # indirizzi da datacenter: provato, il runner di GitHub non ne riceve
    # nessuno. Su una macchina con IP residenziale e Chrome, invece, il giro
    # funziona. Tutti gli altri job restano su `ubuntu-latest`: girano gia', e
    # non e' giusto che dipendano da un computer acceso.
    #
    # Se la macchina e' spenta il job resta in coda e lo raccoglie quando
    # torna. Dopo 24 ore GitHub lo lascia cadere.
    runs-on: [self-hosted, casa]
    timeout-minutes: 25
    steps:
      # LA PUNTA DEL RAMO, NON IL COMMIT CHE HA INNESCATO LA RUN.
      #
      # Senza `ref`, `checkout` si pianta sul commit di partenza: in una catena
      # ogni job leggerebbe `data/` com'era prima che il precedente scrivesse,
      # e il commento di `daily.yml` — «ognuno legge cio' che il precedente ha
      # scritto» — sarebbe falso. Con due job che toccano lo stesso file il
      # rebase finale non ha nemmeno una base comune sensata e fallisce.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      # NIENTE `actions/setup-python` QUI, e non e' una semplificazione.
      #
      # Quell'action scarica Python e poi lancia `setup.ps1`; su questa
      # macchina PowerShell rifiuta di eseguire script non firmati — la stessa
      # politica predefinita che ha fatto scrivere `scripts/giornata.py` in
      # Python invece che in `.ps1`. Il runner di casa ha gia' Python 3.12, e
      # usarlo evita di allentare un'impostazione di sistema per un job.
      #
      # L'ambiente sta FUORI dal repository e si riusa fra un giro e l'altro:
      # dentro, un `pip install -e` ripunterebbe l'installazione editable di
      # chi lavora sulla macchina alla cartella di lavoro del runner.
      - name: Ambiente Python
        shell: bash
        run: |
          VENV="$HOME/.pronostici/venv-job"
          [ -x "$VENV/Scripts/python.exe" ] || py -3.12 -m venv "$VENV"
          "$VENV/Scripts/python.exe" -m pip install -q --upgrade pip
          "$VENV/Scripts/python.exe" -m pip install -q -e ".[sofascore]"
          echo "PY=$VENV/Scripts/python.exe" >> "$GITHUB_ENV"

      # L'ARCHIVIO DEI GIOCATORI NON STA NEL REPOSITORY — sono statistiche di
      # terzi e il repository e' pubblico — ma senza di lui ogni esecuzione
      # rifarebbe centinaia di chiamate per ricostruire gli stessi tassi. La
      # cache lo tiene fra un giro e l'altro; se scade si rigenera da sola, piu'
      # lentamente e senza sbagliare niente.
      - name: Archivio dei giocatori
        uses: actions/cache@v5
        with:
          path: data/sofascore/giocatori.json
          key: sofascore-giocatori-${{ github.run_id }}
          restore-keys: sofascore-giocatori-

      - name: Chrome c'e'?
        shell: bash
        run: |
          C="/c/Program Files/Google/Chrome/Application/chrome.exe"
          [ -f "$C" ] || { echo "::error::Chrome non trovato in $C"; exit 1; }
          echo "trovato: $C"
      - name: Formazioni, arbitro e quote
        # `shell: bash` e non il default, che e' `bash -e` senza `pipefail`:
        # con il python in pipe a `tee` il codice di uscita che conta e'
        # quello di `tee`, sempre zero. Senza questa riga il job resta verde
        # qualunque cosa il job dica.
        shell: bash
        run: |
          ARGS="--window-days ${{ inputs.window_days || '4' }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          # Niente `xvfb-run`: il runner di casa gira dentro una sessione
          # utente vera, quindi Chrome ha gia' un desktop su cui aprirsi. Ed e'
          # un Chrome normale, senza flag di automazione — con quelli la
          # challenge di Sofascore non passa.
          "$PY" -m pronostici.jobs.sofascore $ARGS             | tee "$RUNNER_TEMP/sofascore.json"

      # LE STIME SUI GIOCATORI DIPENDONO DALLE FORMAZIONI: senza sapere chi
      # gioca non si possono fare, quindi girano dopo e nello stesso giro.
      # `|| true` perche' un guasto qui non deve impedire il commit di
      # formazioni e arbitro, che sono gia' stati presi e valgono da soli.
      - name: Stime sui giocatori
        # `shell: bash` e non il default, che e' `bash -e` senza `pipefail`:
        # con il python in pipe a `tee` il codice di uscita che conta e'
        # quello di `tee`, sempre zero. Senza questa riga il job resta verde
        # qualunque cosa il job dica.
        shell: bash
        run: |
          "$PY" -m pronostici.jobs.giocatori \
            --window-days "${{ inputs.window_days || '4' }}" \
            | tee "$RUNNER_TEMP/giocatori.json" || true

      - name: Riepilogo
        if: always()
        # Dichiarata perche' su un runner Windows il default e'
        # PowerShell, e questo passo e' bash: senza, fallisce sulla
        # prima riga.
        shell: bash
        run: |
          for f in sofascore giocatori; do
            [ -s "$RUNNER_TEMP/$f.json" ] || continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            tail -c 4000 "$RUNNER_TEMP/$f.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: ./.github/actions/commit-data
        with:
          message: "dati: formazioni, arbitro e quote estese"
          paths: data/fixtures data/sofascore/squadre.json
