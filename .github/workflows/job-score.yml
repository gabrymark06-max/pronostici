name: job · score

# Pronostico preliminare (w = 1,0) per le partite dei prossimi giorni.
# Scrive i file giornalieri e **aggiunge** al registro: non riscrive mai una
# riga, e non tocca una partita gia' finalizzata.

on:
  workflow_call:
    inputs:
      days:
        type: string
        required: false
        default: "7"
  workflow_dispatch:
    inputs:
      days:
        description: Orizzonte in giorni
        type: string
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: pronostici-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Score
        run: python -m pronostici.jobs.score --days "${{ inputs.days || '7' }}" | tee "$RUNNER_TEMP/report.json"
      - name: Riepilogo
        run: |
          echo '### score' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          tail -c 4000 "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/commit-data
        with:
          message: "dati: pronostici preliminari"
          paths: data/fixtures data/ledger
