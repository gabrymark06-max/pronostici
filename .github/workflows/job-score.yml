name: job · score

# Pronostico preliminare (w = 1,0) per le partite dei prossimi giorni.
# Scrive i file giornalieri e **aggiunge** al registro: non riscrive mai una
# riga, e non tocca una partita gia' finalizzata.

on:
  workflow_call:
    inputs:
      days:
        type: string
        required: false
        default: "7"
  workflow_dispatch:
    inputs:
      days:
        description: Orizzonte in giorni
        type: string
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: pronostici-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # LA PUNTA DEL RAMO, NON IL COMMIT CHE HA INNESCATO LA RUN.
      #
      # Senza `ref`, `checkout` si pianta sul commit di partenza: in una catena
      # ogni job leggerebbe `data/` com'era prima che il precedente scrivesse,
      # e il commento di `daily.yml` — «ognuno legge cio' che il precedente ha
      # scritto» — sarebbe falso. Con due job che toccano lo stesso file il
      # rebase finale non ha nemmeno una base comune sensata e fallisce.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Score
        # `shell: bash` e non il default, che e' `bash -e` senza `pipefail`:
        # con il python in pipe a `tee` il codice di uscita che conta e'
        # quello di `tee`, sempre zero. Senza questa riga il job resta verde
        # qualunque cosa il job dica.
        shell: bash
        run: python -m pronostici.jobs.score --days "${{ inputs.days || '7' }}" | tee "$RUNNER_TEMP/report.json"
      - name: Riepilogo
        run: |
          echo '### score' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          tail -c 4000 "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/commit-data
        with:
          message: "dati: pronostici preliminari"
          paths: data/fixtures data/ledger
