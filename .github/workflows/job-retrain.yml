name: job · retrain

# Fit Dixon-Coles + 300 bootstrap, per campionato. E' il passo costoso ed e'
# O(campionati), non O(partite): gira solo dove sono arrivati nuovi risultati.
# Misurato su questo repository: ~72 s per tutte e dieci le competizioni.

on:
  workflow_call:
    inputs:
      competitions:
        type: string
        required: false
        default: ""
      force:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      competitions:
        description: Codici separati da spazio (vuoto = tutte)
        type: string
        required: false
        default: ""
      force:
        description: Rifitta anche senza nuovi risultati
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: pronostici-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # LA PUNTA DEL RAMO, NON IL COMMIT CHE HA INNESCATO LA RUN.
      #
      # Senza `ref`, `checkout` si pianta sul commit di partenza: in una catena
      # ogni job leggerebbe `data/` com'era prima che il precedente scrivesse,
      # e il commento di `daily.yml` — «ognuno legge cio' che il precedente ha
      # scritto» — sarebbe falso. Con due job che toccano lo stesso file il
      # rebase finale non ha nemmeno una base comune sensata e fallisce.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Retrain
        run: |
          ARGS=""
          [ -n "${{ inputs.competitions }}" ] && ARGS="$ARGS --competitions ${{ inputs.competitions }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python -m pronostici.jobs.retrain $ARGS | tee "$RUNNER_TEMP/report.json"
      - name: Riepilogo
        run: |
          echo '### retrain' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          tail -c 4000 "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/commit-data
        with:
          message: "dati: retrain parametri e bootstrap"
          paths: data/leagues
