name: sonda · fonti

# TEMPORANEO, e si cancella appena ha risposto.
#
# Serve a una domanda sola: questa fonte risponde da un IP di datacenter? E' la
# domanda che Sofascore ha insegnato a fare per primo invece che per ultimo —
# li' la fonte funzionava benissimo dal portatile di chi sviluppa, e il job e'
# finito su un runner di casa per tre giorni prima che qualcuno provasse.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chi risponde da qui?
        shell: bash
        run: python scripts/sonda-fonti.py | tee -a "$GITHUB_STEP_SUMMARY"
