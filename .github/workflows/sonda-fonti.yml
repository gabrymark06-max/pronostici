name: sonda · fonti formazioni

# TEMPORANEO. Serve a rispondere a una domanda sola: quali fonti di formazioni
# rispondono da un IP di datacenter. Sofascore non lo fa — e' il motivo per cui
# il suo job gira su un runner di casa — e prima di riscrivere l'integrazione
# contro un'altra fonte va verificato che quella funzioni DA QUI, non dal
# portatile di chi sviluppa. Si cancella appena la risposta c'e'.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chi risponde da qui?
        shell: bash
        run: python scripts/sonda-fonti.py | tee -a "$GITHUB_STEP_SUMMARY"
