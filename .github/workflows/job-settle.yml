name: job · settle

# L'esito e lo skill realizzato. E' l'unico job che scrive su righe gia'
# pubblicate, e puo' toccare **solo** i campi di esito, **solo** quando sono
# ancora vuoti: il pronostico e la sua data restano quelli.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Calcola e riporta senza scrivere niente
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: pronostici-settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # LA PUNTA DEL RAMO, NON IL COMMIT CHE HA INNESCATO LA RUN.
      #
      # Senza `ref`, `checkout` si pianta sul commit di partenza: in una catena
      # ogni job leggerebbe `data/` com'era prima che il precedente scrivesse,
      # e il commento di `daily.yml` — «ognuno legge cio' che il precedente ha
      # scritto» — sarebbe falso. Con due job che toccano lo stesso file il
      # rebase finale non ha nemmeno una base comune sensata e fallisce.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Settle
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          python -m pronostici.jobs.settle $ARGS | tee "$RUNNER_TEMP/report.json"
      - name: Riepilogo
        run: |
          echo '### settle — dichiarato contro realizzato' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          tail -c 4000 "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/commit-data
        with:
          message: "dati: esiti e accuratezza"
          paths: data/ledger data/fixtures data/accuracy.json
