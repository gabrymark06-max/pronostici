name: job · finalize

# Quote a T-36h, de-vig power, w = 0,35, riga **definitiva** nel registro.
# Spende crediti: due per campionato che gioca davvero, e solo per quelli.
# Senza ODDS_API_KEY il job non fallisce — degrada a "solo modello" e le
# partite restano col loro preliminare.

on:
  workflow_call:
    inputs:
      window_hours:
        type: string
        required: false
        default: "36"
      competitions:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      window_hours:
        description: Finestra in ore prima del calcio d'inizio
        type: string
        required: false
        default: "36"
      competitions:
        description: Codici separati da spazio (vuoto = tutte)
        type: string
        required: false
        default: ""
      dry_run:
        description: Calcola e riporta senza scrivere niente
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: pronostici-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # LA PUNTA DEL RAMO, NON IL COMMIT CHE HA INNESCATO LA RUN.
      #
      # Senza `ref`, `checkout` si pianta sul commit di partenza: in una catena
      # ogni job leggerebbe `data/` com'era prima che il precedente scrivesse,
      # e il commento di `daily.yml` — «ognuno legge cio' che il precedente ha
      # scritto» — sarebbe falso. Con due job che toccano lo stesso file il
      # rebase finale non ha nemmeno una base comune sensata e fallisce.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Finalize
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Meta' della quota mensile. Se lo tocchiamo c'e' un bug, non un
          # picco di traffico: il sito non ha un runtime da cui chiamare.
          ODDS_CREDIT_CAP: "250"
        # `shell: bash` e non il default, che e' `bash -e` senza `pipefail`:
        # con il python in pipe a `tee` il codice di uscita che conta e'
        # quello di `tee`, sempre zero. Senza questa riga il job resta verde
        # qualunque cosa il job dica.
        shell: bash
        run: |
          ARGS="--window-hours ${{ inputs.window_hours || '36' }}"
          [ -n "${{ inputs.competitions }}" ] && ARGS="$ARGS --competitions ${{ inputs.competitions }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python -m pronostici.jobs.finalize $ARGS | tee "$RUNNER_TEMP/report.json"
      - name: Riepilogo
        run: |
          echo '### finalize' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          tail -c 6000 "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/commit-data
        with:
          message: "dati: pronostici definitivi con le quote"
          paths: data/fixtures data/ledger data/odds_budget.json
