<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Il segno del marchio CENTRO: due quadri concentrici e il centro pieno.
       Qui i colori sono letterali e non possono che esserlo — una favicon è
       un file a sé, servita fuori dal foglio di stile, e `var()` non esiste.
       Sono --ground e --segnale del tema scuro (tokens.css): se cambiano lì,
       vanno cambiati anche qui. -->
  <rect width="32" height="32" fill="#0A0D12"/>
  <rect x="4" y="4" width="24" height="24" fill="none" stroke="#EEF2F6" stroke-width="2"/>
  <rect x="11" y="11" width="10" height="10" fill="none" stroke="#EEF2F6" stroke-width="2"/>
  <rect x="14" y="14" width="4" height="4" fill="#FF5C36"/>
</svg>
